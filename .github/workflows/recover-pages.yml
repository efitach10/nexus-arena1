name: Recover stuck Pages deployment
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  cancel-stuck-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Cancel the known stuck Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STUCK_SHA: 72d84daec30de455af5b0685589162dc651d0f9a
        run: |
          set -euo pipefail
          endpoint="repos/$GH_REPO/pages/deployments/$STUCK_SHA"
          status=$(gh api "$endpoint" --jq '.status')
          echo "Previous deployment status: $status"
          case "$status" in
            succeed|failed|canceled|cancelled) exit 0 ;;
          esac
          gh api --method POST "$endpoint/cancel"
          for attempt in $(seq 1 18); do
            status=$(gh api "$endpoint" --jq '.status')
            echo "Previous deployment status: $status"
            case "$status" in
              succeed|failed|canceled|cancelled) exit 0 ;;
            esac
            sleep 5
          done
          echo 'GitHub has not cleared the previous Pages deployment yet.'
          exit 1
